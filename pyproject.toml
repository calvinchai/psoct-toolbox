[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psoct-toolbox"
version = "0.1.0"
description = "PS-OCT MATLAB toolbox packaged as a Python dependency (ships +psoct MATLAB code as data)."
readme = "readme.md"
requires-python = ">=3.9"
authors = [
  { name = "PS-OCT Toolbox Authors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Matlab",
]

[project.urls]
Homepage = "https://example.com/psoct-toolbox"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["psoct_toolbox"]

[tool.setuptools.package-data]
psoct_toolbox = ["matlab/+psoct/**/*"]

